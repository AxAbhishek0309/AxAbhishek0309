<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .card-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 8px; }
      .badge-bg { fill: #E0F2FE; stroke: #0284C7; stroke-width: 0.75; rx: 4px; }
      .tag-bg { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 0.75; rx: 3px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #0F172A; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #475569; }
      .badge-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #0369A1; font-weight: 600; letter-spacing: 0.5px; }
      .tag-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #334155; }
      .indicator { fill: #0284C7; animation: pulse 3.4s infinite ease-in-out; }
      .grid-line { stroke: #F1F5F9; stroke-width: 0.5; }
    </style>
  </defs>

  <rect class="card-bg" width="418" height="158" x="1" y="1"/>

  <line class="grid-line" x1="280" y1="1" x2="280" y2="159"/>
  <line class="grid-line" x1="1" y1="118" x2="419" y2="118"/>

  <circle class="indicator" cx="395" cy="24" r="3"/>
  <circle cx="395" cy="24" r="6" fill="none" stroke="#0284C7" stroke-width="0.5" opacity="0.4"/>

  <rect class="badge-bg" x="20" y="16" width="168" height="18"/>
  <text class="badge-text" x="26" y="29">FINANCIAL DATA PLATFORM</text>

  <text class="title" x="20" y="58">Credence</text>

  <text class="desc" x="20" y="78">Real-time lending intelligence, risk scoring engine,</text>
  <text class="desc" x="20" y="94">anomaly detection &amp; multi-tier medallion pipelines.</text>

  <g transform="translate(20, 126)">
    <rect class="tag-bg" x="0" y="0" width="88" height="20"/>
    <text class="tag-text" x="8" y="14">Medallion Arch</text>

    <rect class="tag-bg" x="94" y="0" width="70" height="20"/>
    <text class="tag-text" x="102" y="14">Delta Lake</text>

    <rect class="tag-bg" x="170" y="0" width="74" height="20"/>
    <text class="tag-text" x="178" y="14">PostgreSQL</text>

    <rect class="tag-bg" x="250" y="0" width="56" height="20"/>
    <text class="tag-text" x="258" y="14">FastAPI</text>

    <rect class="tag-bg" x="312" y="0" width="56" height="20"/>
    <text class="tag-text" x="320" y="14">Next.js</text>
  </g>
</svg>
