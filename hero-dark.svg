<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes drawLine { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
      @keyframes nodeGlow { 0%, 100% { r: 2.5; opacity: 0.4; } 50% { r: 3.5; opacity: 0.9; } }
      @keyframes gridPulse { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.08; } }
      @keyframes scan { 0% { transform: translateY(-320px); } 100% { transform: translateY(320px); } }

      .hero-bg { fill: #080D18; }
      .grid-line { stroke: #243449; stroke-width: 0.5; opacity: 0.06; animation: gridPulse 8s ease-in-out infinite; }
      .name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 42px; fill: #E8EEF7; animation: fadeIn 1.2s ease-out; }
      .tagline { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 16px; fill: #9CAFC5; letter-spacing: 2.5px; animation: fadeIn 1.8s ease-out; }
      .accent-line { stroke: #7DD3FC; stroke-width: 1.5; opacity: 0.5; stroke-dasharray: 1000; animation: drawLine 3s ease-out forwards; }
      .accent-dot { fill: #7DD3FC; }
      .network-edge { stroke: #7DD3FC; stroke-width: 0.6; opacity: 0.15; }
      .network-node { fill: #7DD3FC; animation: nodeGlow 4s ease-in-out infinite; }
      .orbital { stroke: #7DD3FC; stroke-width: 0.5; fill: none; opacity: 0.1; }
      .scan-line { fill: url(#scanGrad); animation: scan 6s linear infinite; }
      .corner-bracket { stroke: #7DD3FC; stroke-width: 1; fill: none; opacity: 0.25; }
      .meta-text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 10px; fill: #9CAFC5; opacity: 0.4; }
      .label-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9px; fill: #7DD3FC; opacity: 0.35; letter-spacing: 1.5px; }
    </style>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="hero-bg" width="900" height="320" rx="6"/>

  <!-- Subtle grid -->
  <g>
    <line class="grid-line" x1="0" y1="40" x2="900" y2="40"/>
    <line class="grid-line" x1="0" y1="80" x2="900" y2="80"/>
    <line class="grid-line" x1="0" y1="120" x2="900" y2="120"/>
    <line class="grid-line" x1="0" y1="160" x2="900" y2="160"/>
    <line class="grid-line" x1="0" y1="200" x2="900" y2="200"/>
    <line class="grid-line" x1="0" y1="240" x2="900" y2="240"/>
    <line class="grid-line" x1="0" y1="280" x2="900" y2="280"/>
    <line class="grid-line" x1="100" y1="0" x2="100" y2="320"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="320"/>
    <line class="grid-line" x1="300" y1="0" x2="300" y2="320"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="320"/>
    <line class="grid-line" x1="500" y1="0" x2="500" y2="320"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="320"/>
    <line class="grid-line" x1="700" y1="0" x2="700" y2="320"/>
    <line class="grid-line" x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Scan line -->
  <rect class="scan-line" x="0" y="0" width="900" height="80" opacity="0.5"/>

  <!-- Neural network / constellation — right side -->
  <g style="animation: float1 12s ease-in-out infinite;">
    <!-- Edges -->
    <line class="network-edge" x1="620" y1="70" x2="690" y2="110"/>
    <line class="network-edge" x1="690" y1="110" x2="750" y2="80"/>
    <line class="network-edge" x1="690" y1="110" x2="730" y2="170"/>
    <line class="network-edge" x1="730" y1="170" x2="800" y2="150"/>
    <line class="network-edge" x1="730" y1="170" x2="680" y2="220"/>
    <line class="network-edge" x1="800" y1="150" x2="840" y2="100"/>
    <line class="network-edge" x1="800" y1="150" x2="830" y2="210"/>
    <line class="network-edge" x1="680" y1="220" x2="750" y2="260"/>
    <line class="network-edge" x1="830" y1="210" x2="750" y2="260"/>
    <line class="network-edge" x1="620" y1="70" x2="660" y2="140"/>
    <line class="network-edge" x1="660" y1="140" x2="680" y2="220"/>
    <line class="network-edge" x1="750" y1="80" x2="840" y2="100"/>
    <line class="network-edge" x1="830" y1="210" x2="860" y2="270"/>
    <line class="network-edge" x1="750" y1="260" x2="860" y2="270"/>

    <!-- Nodes -->
    <circle class="network-node" cx="620" cy="70" r="3" style="animation-delay: 0s;"/>
    <circle class="network-node" cx="690" cy="110" r="3" style="animation-delay: 0.5s;"/>
    <circle class="network-node" cx="750" cy="80" r="2.5" style="animation-delay: 1s;"/>
    <circle class="network-node" cx="730" cy="170" r="3.5" style="animation-delay: 1.5s;"/>
    <circle class="network-node" cx="800" cy="150" r="3" style="animation-delay: 2s;"/>
    <circle class="network-node" cx="840" cy="100" r="2" style="animation-delay: 0.8s;"/>
    <circle class="network-node" cx="660" cy="140" r="2" style="animation-delay: 1.2s;"/>
    <circle class="network-node" cx="680" cy="220" r="3" style="animation-delay: 2.5s;"/>
    <circle class="network-node" cx="830" cy="210" r="2.5" style="animation-delay: 1.8s;"/>
    <circle class="network-node" cx="750" cy="260" r="3" style="animation-delay: 3s;"/>
    <circle class="network-node" cx="860" cy="270" r="2" style="animation-delay: 0.3s;"/>
  </g>

  <!-- Orbital arcs — subtle background -->
  <g style="animation: float2 15s ease-in-out infinite;">
    <ellipse class="orbital" cx="720" cy="160" rx="120" ry="60" transform="rotate(-15 720 160)"/>
    <ellipse class="orbital" cx="720" cy="160" rx="160" ry="80" transform="rotate(10 720 160)"/>
    <ellipse class="orbital" cx="720" cy="160" rx="90" ry="45" transform="rotate(-35 720 160)" opacity="0.06"/>
  </g>

  <!-- Corner brackets -->
  <polyline class="corner-bracket" points="20,30 20,16 34,16"/>
  <polyline class="corner-bracket" points="866,16 880,16 880,30"/>
  <polyline class="corner-bracket" points="20,290 20,304 34,304"/>
  <polyline class="corner-bracket" points="866,304 880,304 880,290"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="900" height="1" fill="url(#borderGrad)"/>

  <!-- Meta labels -->
  <text class="label-text" x="40" y="30">SYS.PROFILE</text>
  <text class="meta-text" x="820" y="30" text-anchor="end">v4.0</text>

  <!-- Main text content -->
  <text class="name" x="60" y="130">Abhishek Tiwari</text>

  <!-- Accent line under name -->
  <line class="accent-line" x1="60" y1="148" x2="280" y2="148"/>
  <circle class="accent-dot" cx="280" cy="148" r="2.5" opacity="0.6"/>

  <!-- Tagline -->
  <text class="tagline" x="60" y="182">BUILDING INTELLIGENT SYSTEMS.</text>
  <text class="tagline" x="60" y="204">ENGINEERING FOR IMPACT.</text>

  <!-- Bottom meta -->
  <text class="meta-text" x="60" y="270">AI Engineering  ·  Full-Stack  ·  Data Science  ·  Intelligent Systems</text>
  <text class="meta-text" x="60" y="288">Manipal University Jaipur  ·  B.Tech CSE, Data Science  ·  2027</text>

  <!-- Bottom border accent -->
  <rect x="0" y="319" width="900" height="1" fill="url(#borderGrad)"/>
</svg>
