<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .card-bg { fill: #0B132B; stroke: #1C2D4A; stroke-width: 1; rx: 8px; }
      .badge-bg { fill: #0C4A6E; fill-opacity: 0.4; stroke: #38BDF8; stroke-width: 0.75; rx: 4px; }
      .tag-bg { fill: #111E38; stroke: #23385D; stroke-width: 0.75; rx: 3px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #F1F5F9; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #94A3B8; }
      .badge-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #38BDF8; font-weight: 600; letter-spacing: 0.5px; }
      .tag-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #CBD5E1; }
      .indicator { fill: #38BDF8; animation: pulse 3s infinite ease-in-out; }
      .grid-line { stroke: #1E293B; stroke-width: 0.5; opacity: 0.25; }
    </style>
  </defs>

  <rect class="card-bg" width="418" height="158" x="1" y="1"/>

  <!-- Subtle accent lines in background -->
  <line class="grid-line" x1="280" y1="1" x2="280" y2="159"/>
  <line class="grid-line" x1="1" y1="118" x2="419" y2="118"/>

  <!-- Live/Active Indicator Dot -->
  <circle class="indicator" cx="395" cy="24" r="3"/>
  <circle cx="395" cy="24" r="6" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.4"/>

  <!-- Highlight Badge -->
  <rect class="badge-bg" x="20" y="16" width="128" height="18"/>
  <text class="badge-text" x="26" y="29">IEEE ICETCE 2025</text>

  <!-- Title -->
  <text class="title" x="20" y="58">HireIndex</text>

  <!-- Description -->
  <text class="desc" x="20" y="78">AI recruitment platform with RAG resume screening,</text>
  <text class="desc" x="20" y="94">SBERT + FAISS dense retrieval &amp; SHAP explainability.</text>

  <!-- Tags Row -->
  <g transform="translate(20, 126)">
    <rect class="tag-bg" x="0" y="0" width="68" height="20"/>
    <text class="tag-text" x="8" y="14">DistilBERT</text>

    <rect class="tag-bg" x="74" y="0" width="76" height="20"/>
    <text class="tag-text" x="82" y="14">SBERT+FAISS</text>

    <rect class="tag-bg" x="156" y="0" width="58" height="20"/>
    <text class="tag-text" x="164" y="14">FastAPI</text>

    <rect class="tag-bg" x="220" y="0" width="68" height="20"/>
    <text class="tag-text" x="228" y="14">Gemini API</text>

    <rect class="tag-bg" x="294" y="0" width="50" height="20"/>
    <text class="tag-text" x="302" y="14">React</text>
  </g>
</svg>
